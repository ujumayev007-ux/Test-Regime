<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qallama Do'koni</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #222222);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .products-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }

        .product-card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .product-img {
            width: 100%;
            max-width: 180px;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .product-weight {
            font-size: 13px;
            color: #777777;
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 16px;
            color: var(--tg-theme-button-color, #0088cc);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .counter-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-counter {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .count-display {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
        }

        .order-summary {
            margin-top: 24px;
            width: 100%;
            max-width: 400px;
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .date-picker-container {
            margin-bottom: 16px;
            text-align: left;
        }

        .date-label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--tg-theme-text-color, #333333);
        }

        .date-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            font-family: inherit;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
        }

        .total-price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .btn-order {
            background-color: #28a745;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-order:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1 id="user-greeting">Mazzali Qallamalar!</h1>

    <div class="products-container">
        <!-- 1. Kichik qallama -->
        <div class="product-card">
            <img class="product-img" src="https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=400&q=80" alt="Kichik qallama">
            <div class="product-title">Kichik qallama</div>
            <div class="product-weight">O'lchami: 300 gramm</div>
            <div class="product-price">8,000 so'm</div>
            <div class="counter-container">
                <button class="btn-counter" onclick="changeQuantity('small', -1)">-</button>
                <span class="count-display" id="count-small">0</span>
                <button class="btn-counter" onclick="changeQuantity('small', 1)">+</button>
            </div>
        </div>

        <!-- 2. Standard qallama -->
        <div class="product-card">
            <img class="product-img" src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=400&q=80" alt="Standard qallama">
            <div class="product-title">Standard qallama</div>
            <div class="product-weight">O'lchami: 550 gramm</div>
            <div class="product-price">10,000 so'm</div>
            <div class="counter-container">
                <button class="btn-counter" onclick="changeQuantity('standard', -1)">-</button>
                <span class="count-display" id="count-standard">0</span>
                <button class="btn-counter" onclick="changeQuantity('standard', 1)">+</button>
            </div>
        </div>

        <!-- 3. Katta qallama -->
        <div class="product-card">
            <img class="product-img" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=400&q=80" alt="Katta qallama">
            <div class="product-title">Katta qallama</div>
            <div class="product-weight">O'lchami: 700 gramm</div>
            <div class="product-price">15,000 so'm</div>
            <div class="counter-container">
                <button class="btn-counter" onclick="changeQuantity('large', -1)">-</button>
                <span class="count-display" id="count-large">0</span>
                <button class="btn-counter" onclick="changeQuantity('large', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="order-summary">
        <div class="date-picker-container">
            <label class="date-label" for="delivery-date">📅 Qaysi kunga kerak?</label>
            <input type="date" id="delivery-date" class="date-input" onchange="updateTotal()">
        </div>

        <div class="total-price" id="total-text">Jami: 0 so'm</div>
        <button class="btn-order" id="order-btn" onclick="sendOrder()" disabled>Buyurtma berish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BOT_TOKEN = "7923403798:AAG5jzoEdh6DkPBYYyJohtOrS66Z2EBnl5c";
        const ADMIN_CHAT_ID = "8511645883"; // Siz bergan Telegram ID

        const dateInput = document.getElementById('delivery-date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Salom, ${tg.initDataUnsafe.user.first_name}! Tanlang:`;
        }

        const prices = {
            small: 8000,
            standard: 10000,
            large: 15000
        };

        const quantities = {
            small: 0,
            standard: 0,
            large: 0
        };

        function changeQuantity(item, change) {
            if (quantities[item] + change >= 0) {
                quantities[item] += change;
                document.getElementById(`count-${item}`).innerText = quantities[item];
                updateTotal();
            }
        }

        function updateTotal() {
            const total = (quantities.small * prices.small) + 
                          (quantities.standard * prices.standard) + 
                          (quantities.large * prices.large);
            
            const selectedDate = document.getElementById('delivery-date').value;

            document.getElementById('total-text').innerText = `Jami: ${total.toLocaleString('uz-UZ')} so'm`;
            document.getElementById('order-btn').disabled = !(total > 0 && selectedDate);
        }

        async function sendOrder() {
            const user = tg.initDataUnsafe.user || { first_name: "Noma'lum", username: "yo'q" };
            const total = (quantities.small * prices.small) + 
                          (quantities.standard * prices.standard) + 
                          (quantities.large * prices.large);
            const selectedDate = document.getElementById('delivery-date').value;

            let messageText = `📥 <b>YANGI BUYURTMA!</b>\n\n`;
            messageText += `👤 <b>Xaridor:</b> ${user.first_name} (@${user.username || 'username_yoq'})\n`;
            messageText += `📅 <b>Yetkaziladigan sana:</b> ${selectedDate}\n\n`;
            messageText += `🫓 <b>Buyurtma qilindi:</b>\n`;

            if (quantities.small > 0) messageText += `• Kichik qallama (300g): ${quantities.small} ta\n`;
            if (quantities.standard > 0) messageText += `• Standard qallama (550g): ${quantities.standard} ta\n`;
            if (quantities.large > 0) messageText += `• Katta qallama (700g): ${quantities.large} ta\n`;

            messageText += `\n💰 <b>Jami summa:</b> ${total.toLocaleString('uz-UZ')} so'm`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: messageText,
                        parse_mode: 'HTML'
                    })
                });

                alert("Buyurtmangiz qabul qilindi!");
                tg.close();
            } catch (error) {
                alert("Xatolik yuz berdi, qaytadan urinib ko'ring.");
            }
        }
    </script>
</body>
</html>
