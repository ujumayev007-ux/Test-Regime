<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qallama Do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #222222);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 20px; margin-bottom: 16px; text-align: center; }
        .products-container { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 400px; }
        .product-card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px; padding: 16px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .product-img { width: 100%; max-width: 180px; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .product-title { font-size: 18px; font-weight: bold; }
        .product-weight { font-size: 13px; color: #777; margin-bottom: 6px; }
        .product-price { font-size: 16px; color: #0088cc; font-weight: bold; margin-bottom: 12px; }
        .counter-container { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .btn-counter {
            background-color: #0088cc; color: white; border: none;
            width: 36px; height: 36px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer;
        }
        .count-display { font-size: 18px; font-weight: bold; min-width: 24px; }
        .order-summary {
            margin-top: 24px; width: 100%; max-width: 400px;
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 16px; border-radius: 12px;
        }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .form-input, .form-select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;
            font-size: 15px; outline: none; background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .total-price { font-size: 18px; font-weight: bold; margin-bottom: 12px; text-align: center; }
        .btn-order {
            background-color: #28a745; color: #fff; border: none; width: 100%;
            padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn-order:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1 id="user-greeting">Mazzali Qallamalar!</h1>

    <div class="products-container">
        <div class="product-card">
            <img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsDLbDfZFJ4A4cX5P9amgLjd7SG-UoIzkjnyhvMLbaGW8IQDQdJ8aHHyA&s=10" alt="Kichik">
            <div class="product-title">Kichik qallama</div>
            <div class="product-weight">O'lchami: 300 gramm</div>
            <div class="product-price">8,000 so'm</div>
            <div class="counter-container">
                <button class="btn-counter" onclick="changeQuantity('small', -1)">-</button>
                <span class="count-display" id="count-small">0</span>
                <button class="btn-counter" onclick="changeQuantity('small', 1)">+</button>
            </div>
        </div>

        <div class="product-card">
            <img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsDLbDfZFJ4A4cX5P9amgLjd7SG-UoIzkjnyhvMLbaGW8IQDQdJ8aHHyA&s=10" alt="Standard">
            <div class="product-title">Standard qallama</div>
            <div class="product-weight">O'lchami: 550 gramm</div>
            <div class="product-price">10,000 so'm</div>
            <div class="counter-container">
                <button class="btn-counter" onclick="changeQuantity('standard', -1)">-</button>
                <span class="count-display" id="count-standard">0</span>
                <button class="btn-counter" onclick="changeQuantity('standard', 1)">+</button>
            </div>
        </div>

        <div class="product-card">
            <img class="product-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsDLbDfZFJ4A4cX5P9amgLjd7SG-UoIzkjnyhvMLbaGW8IQDQdJ8aHHyA&s=10" alt="Katta">
            <div class="product-title">Katta qallama</div>
            <div class="product-weight">O'lchami: 700 gramm</div>
            <div class="product-price">15,000 so'm</div>
            <div class="counter-container">
                <button class="btn-counter" onclick="changeQuantity('large', -1)">-</button>
                <span class="count-display" id="count-large">0</span>
                <button class="btn-counter" onclick="changeQuantity('large', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="order-summary">
        <div class="form-group">
            <label class="form-label" for="delivery-date">📅 Qaysi kunga kerak?</label>
            <input type="date" id="delivery-date" class="form-input" onchange="updateTotal()">
        </div>

        <div class="form-group">
            <label class="form-label" for="delivery-time">⏰ Soat nechida olib ketasiz?</label>
            <select id="delivery-time" class="form-select" onchange="updateTotal()">
                <option value="" disabled selected>Vaqtni tanlang...</option>
                <option value="06:00">06:00 da</option>
                <option value="07:00">07:00 da</option>
                <option value="10:00">10:00 da</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="branch-select">📍 Qaysi filialdan olib ketasiz?</label>
            <select id="branch-select" class="form-select" onchange="updateTotal()">
                <option value="" disabled selected>Filialni tanlang...</option>
                <option value="Bozorcha">Bozorcha</option>
                <option value="Chinor tagi">Chinor tagi</option>
                <option value="Avtovokzal">Avtovokzal</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="phone-number">📞 Telefon raqamingiz (Ixtiyoriy):</label>
            <input type="tel" id="phone-number" class="form-input" placeholder="+998901234567">
        </div>

        <div class="total-price" id="total-text">Jami: 0 so'm</div>
        <button class="btn-order" id="order-btn" onclick="sendOrder()" disabled>Buyurtma berish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Keyinchalik server manzilingizni shu yerga qo'yasiz
        const SERVER_URL = "https://server-manzilingiz.onrender.com"; 

        const dateInput = document.getElementById('delivery-date');
        dateInput.min = new Date().toISOString().split('T')[0];

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Salom, ${tg.initDataUnsafe.user.first_name}!`;
        }

        const prices = { small: 8000, standard: 10000, large: 15000 };
        const quantities = { small: 0, standard: 0, large: 0 };

        function changeQuantity(item, change) {
            if (quantities[item] + change >= 0) {
                quantities[item] += change;
                document.getElementById(`count-${item}`).innerText = quantities[item];
                updateTotal();
            }
        }

        function updateTotal() {
            const total = (quantities.small * prices.small) + 
                          (quantities.standard * prices.standard) + 
                          (quantities.large * prices.large);
            
            const selectedDate = document.getElementById('delivery-date').value;
            const selectedTime = document.getElementById('delivery-time').value;
            const selectedBranch = document.getElementById('branch-select').value;

            document.getElementById('total-text').innerText = `Jami: ${total.toLocaleString('uz-UZ')} so'm`;
            document.getElementById('order-btn').disabled = !(total > 0 && selectedDate && selectedTime && selectedBranch);
        }

        async function sendOrder() {
            const user = tg.initDataUnsafe.user || { id: 0, first_name: "Xaridor", username: "yoq" };
            const total = (quantities.small * prices.small) + 
                          (quantities.standard * prices.standard) + 
                          (quantities.large * prices.large);
            
            let itemsText = "";
            if (quantities.small > 0) itemsText += `• Kichik qallama (300g): ${quantities.small} ta\n`;
            if (quantities.standard > 0) itemsText += `• Standard qallama (550g): ${quantities.standard} ta\n`;
            if (quantities.large > 0) itemsText += `• Katta qallama (700g): ${quantities.large} ta\n`;

            const payload = {
                userId: user.id,
                userName: user.first_name,
                userHandle: user.username,
                phone: document.getElementById('phone-number').value.trim(),
                date: document.getElementById('delivery-date').value,
                time: document.getElementById('delivery-time').value,
                branch: document.getElementById('branch-select').value,
                items: itemsText,
                totalPrice: total.toLocaleString('uz-UZ')
            };

            try {
                const response = await fetch(`${SERVER_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    alert(`Buyurtmangiz qabul qilindi! Buyurtma raqami: #${result.orderId}`);
                    tg.close();
                } else {
                    alert("Xatolik yuz berdi.");
                }
            } catch (error) {
                alert("Server bilan aloqa o'rnatilmadi.");
            }
        }
    </script>
</body>
</html>
