<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qallama Do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #f4f4f9; }
        .section { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn { padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px; background: #f8f9fa; cursor: pointer; flex: 1; min-width: 120px; text-align: center; }
        .btn.active { background: #0088cc; color: #fff; border-color: #0088cc; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .hidden { display: none; }
        .order-btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. VAQTNI TANLASH BO'LIMI -->
    <div class="section">
        <h3>⏰ Olib ketish/Yetkazish vaqti:</h3>
        <div class="btn-group" id="timeGroup">
            <div class="btn" onclick="selectTime('06:00', this)">06:00</div>
            <div class="btn" onclick="selectTime('12:00', this)">12:00</div>
            <div class="btn" onclick="selectTime('18:00', this)">18:00</div>
            <div class="btn" onclick="selectTime('custom', this)">⏱ Boshqa vaqt</div>
        </div>
        <input type="text" id="customTimeInput" class="hidden" placeholder="Vaqtni kiriting (Masalan: 14:30 yoki soat 3 da)">
    </div>

    <!-- 2. FILIAL / MANZILNI TANLASH BO'LIMI -->
    <div class="section">
        <h3>📍 Qaysi filialdan olib ketasiz?</h3>
        <div class="btn-group" id="branchGroup">
            <div class="btn" onclick="selectBranch('Bozorcha', this)">Bozorcha</div>
            <div class="btn" onclick="selectBranch('Markaziy', this)">Markaziy</div>
            <div class="btn" onclick="selectBranch('Vokzal', this)">Vokzal</div>
            <div class="btn" onclick="selectBranch('custom', this)">📍 Boshqa joy</div>
        </div>

        <!-- Boshqa joy tanlanganda chiqadigan optionlar -->
        <div id="customLocationOptions" class="hidden" style="margin-top: 15px;">
            <p><b>Yetkazib berish manzilini tanlang:</b></p>
            <div class="btn-group">
                <div class="btn" onclick="chooseLocationType('manual')">✍️ Qo'lda kiritish</div>
                <div class="btn" onclick="chooseLocationType('geo')">📍 Geolokatsiya jo'natish</div>
            </div>

            <!-- 1-Option: Qo'lda kiritish inputi -->
            <input type="text" id="manualAddressInput" class="hidden" placeholder="Aniq manzilingizni kiriting (Masalan: Navoiy ko'chasi, 25-uy)">

            <!-- 2-Option: Geolokatsiya holati matni -->
            <p id="geoStatus" style="font-size: 13px; color: green; margin-top: 8px;"></p>
        </div>
    </div>

    <button class="order-btn" onclick="submitOrder()">🛍 Buyurtmani tasdiqlash</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedTime = '';
        let selectedBranch = '';
        let userLocationGeo = ''; // GPS koordinatalari uchun

        // VAQT TANLASH MANTIQLARI
        function selectTime(timeVal, el) {
            document.querySelectorAll('#timeGroup .btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            const customInput = document.getElementById('customTimeInput');
            if (timeVal === 'custom') {
                customInput.classList.remove('hidden');
                selectedTime = 'custom';
            } else {
                customInput.classList.add('hidden');
                selectedTime = timeVal;
            }
        }

        // FILIAL TANLASH MANTIQLARI
        function selectBranch(branchVal, el) {
            document.querySelectorAll('#branchGroup .btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            const customLocBox = document.getElementById('customLocationOptions');
            if (branchVal === 'custom') {
                customLocBox.classList.remove('hidden');
                selectedBranch = 'custom';
            } else {
                customLocBox.classList.add('hidden');
                document.getElementById('manualAddressInput').classList.add('hidden');
                document.getElementById('geoStatus').innerText = '';
                selectedBranch = branchVal;
                userLocationGeo = '';
            }
        }

        // BOSHQA JOY ICHIDAGI OPTIONLAR (Qo'lda yoki Geo)
        function chooseLocationType(type) {
            const manualInput = document.getElementById('manualAddressInput');
            const geoStatus = document.getElementById('geoStatus');

            if (type === 'manual') {
                manualInput.classList.remove('hidden');
                geoStatus.innerText = '';
                userLocationGeo = '';
            } else if (type === 'geo') {
                manualInput.classList.add('hidden');
                manualInput.value = '';
                geoStatus.innerText = "⏳ Geolokatsiya aniqlanmoqda...";

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            userLocationGeo = `https://maps.google.com/?q=${lat},${lon}`;
                            geoStatus.innerText = "✅ Geolokatsiyangiz aniqlandi!";
                        },
                        (error) => {
                            alert("Geolokatsiyani olishga ruxsat berilmadi yoki aniqlab bo'lmadi.");
                            geoStatus.innerText = "❌ Geolokatsiya olinmadi. Iltimos, manzilni qo'lda kiriting.";
                            manualInput.classList.remove('hidden');
                        }
                    );
                } else {
                    alert("Qurilmangizda geolokatsiya funksiyasi qo'llab-quvvatlanmaydi.");
                }
            }
        }

        // BUYURTMANI YUBORISH
        async function submitOrder() {
            // Vaqtni aniqlash
            let finalTime = selectedTime;
            if (selectedTime === 'custom') {
                finalTime = document.getElementById('customTimeInput').value.trim();
                if (!finalTime) {
                    alert("Iltimos, o'zingiz xohlagan vaqtni kiriting!");
                    return;
                }
            } else if (!selectedTime) {
                alert("Iltimos, vaqtni tanlang!");
                return;
            }

            // Filial / Manzilni aniqlash
            let finalBranch = selectedBranch;
            if (selectedBranch === 'custom') {
                const manualAddr = document.getElementById('manualAddressInput').value.trim();
                if (userLocationGeo) {
                    finalBranch = `🚚 Yetkazib berish (Geolokatsiya: ${userLocationGeo})`;
                } else if (manualAddr) {
                    finalBranch = `🚚 Yetkazib berish (Manzil: ${manualAddr})`;
                } else {
                    alert("Iltimos, manzilni kiriting yoki geolokatsiyangizni yuboring!");
                    return;
                }
            } else if (!selectedBranch) {
                alert("Iltimos, filialni tanlang!");
                return;
            }

            // Telegram user ma'lumotlari
            const user = tg.initDataUnsafe?.user || {};

            const orderPayload = {
                userId: user.id || null,
                userName: user.first_name || 'Mijoz',
                userHandle: user.username || '',
                phone: "+998901234567", // Buni formangizdagi tel raqam inputidan olsangiz bo'ladi
                time: finalTime,
                branch: finalBranch,
                date: new Date().toLocaleDateString('uz-UZ'),
                items: "• Kichik qallama (300g): 2 ta", // Mini App dagi tanlangan mahsulotlar
                totalPrice: "32 000"
            };

            // Serverga API so'rov yuborish
            try {
                const res = await fetch('https://test-regime.onrender.com/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                const data = await res.json();
                if (data.success) {
                    tg.close(); // Mini App ni yopish
                } else {
                    alert("Xatolik yuz berdi. Qayta urinib ko'ring.");
                }
            } catch (err) {
                console.error(err);
                alert("Server bilan aloqa uzildi!");
            }
        }
    </script>
</body>
</html>
